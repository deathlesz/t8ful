[package]
name = "t8ful-openai"
description = "OpenAI-compatible transport shared by t8ful providers: SSE, tool-call assembly, HTTP, and prompt serialization"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
t8ful-core.workspace = true
base64.workspace = true
futures-core.workspace = true
futures-util.workspace = true
reqwest.workspace = true
rustls.workspace = true
webpki-roots.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["net"] }

[features]
# The loopback fake server shared by provider test suites. Off by default so a
# release build never carries test-only HTTP code.
test-support = []

[dev-dependencies]
tokio = { workspace = true, features = ["net", "io-util", "macros", "rt-multi-thread", "time"] }
divan.workspace = true
tempfile.workspace = true

[[bench]]
name = "sse"
harness = false

[lints]
workspace = true
